spring.application.name=SistemaDeAdopciones
server.port=8080

# Tomcat Configuration - Development
server.servlet.context-path=/
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10
server.tomcat.accept-count=100
server.tomcat.max-connections=10000
server.tomcat.connection-timeout=20000
server.servlet.session.timeout=30m
server.tomcat.uri-encoding=UTF-8
server.compression.enabled=true
server.compression.min-response-size=1024

# Character Encoding Configuration for Spanish Support (UTF-8)
spring.http.encoding.enabled=true
spring.http.encoding.charset=UTF-8
spring.http.encoding.force=true
server.servlet.jsp.init-parameters.jspCompilerSourceVM=11
server.servlet.jsp.init-parameters.jspCompilerTargetVM=11

# JSP Configuration
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp
server.servlet.jsp.init-parameters.development=true

# Database Configuration - Development
spring.datasource.url=jdbc:mysql://localhost:3306/adopciones_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&useUnicode=true
spring.datasource.username=myuser
spring.datasource.password=secret
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000

# JPA Configuration with UTF-8 Support
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=10
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.connection.CharSet=UTF-8
spring.jpa.properties.hibernate.connection.characterEncoding=UTF-8
spring.jpa.properties.hibernate.connection.useUnicode=true

# Logging - Development
logging.level.root=INFO
logging.level.com.example.GR01_1BT3_622_26A=DEBUG
logging.level.org.hibernate=INFO
logging.level.org.springframework.web=DEBUG
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Spring Boot Config
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# Jackson Configuration
spring.jackson.serialization.indent_output=true
spring.jackson.serialization.write_dates_as_timestamps=false
spring.jackson.time-zone=America/Bogota

# Thymeleaf Configuration — T.3.2
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# Refugio Configuration — T.3.2
app.refugio.nombre=Paws & Home Sanctuary
app.refugio.representante=Administración Refugio
app.refugio.whatsapp=+34666777888
app.refugio.email=adopciones@pawshome.com
app.refugio.horario=Lunes-Viernes 09:00-18:00

