spring.application.name=SistemaDeAdopciones
server.port=8090

# Disable Docker Compose auto-config
spring.docker.compose.enabled=false
server.servlet.context-path=/
server.tomcat.uri-encoding=UTF-8

# Character Encoding Configuration for Spanish Support (UTF-8)
spring.http.encoding.enabled=true
spring.http.encoding.charset=UTF-8
spring.http.encoding.force=true
server.servlet.jsp.init-parameters.jspCompilerSourceVM=11
server.servlet.jsp.init-parameters.jspCompilerTargetVM=11

# JSP Configuration
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# Database Configuration - Docker MySQL Container
spring.datasource.url=jdbc:mysql://adopciones-mysql:3306/adopciones_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&useUnicode=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=myuser
spring.datasource.password=secret

# HikariCP - retry connection
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.initialization-fail-timeout=60000

# JPA Configuration with UTF-8 Support
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.connection.CharSet=UTF-8
spring.jpa.properties.hibernate.connection.characterEncoding=UTF-8
spring.jpa.properties.hibernate.connection.useUnicode=true

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Thymeleaf Configuration — T.3.2
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=true
spring.thymeleaf.encoding=UTF-8

# Refugio Configuration — T.3.2
app.refugio.nombre=Paws & Home Sanctuary
app.refugio.representante=Administración Refugio
app.refugio.whatsapp=+34666777888
app.refugio.email=adopciones@pawshome.com
app.refugio.horario=Lunes-Viernes 09:00-18:00

# Logging
logging.level.root=INFO
logging.level.com.example.GR01_1BT3_622_26A=DEBUG

