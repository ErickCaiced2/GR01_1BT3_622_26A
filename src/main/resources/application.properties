spring.application.name=SistemaDeAdopciones
server.port=8090

# Disable Docker Compose
spring.docker.compose.enabled=false
server.servlet.context-path=/
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10
server.tomcat.accept-count=100
server.tomcat.max-connections=10000
server.tomcat.connection-timeout=20000
server.servlet.session.timeout=30m
server.tomcat.uri-encoding=UTF-8
server.compression.enabled=true
server.compression.min-response-size=1024

# Character Encoding Configuration for Spanish Support (UTF-8)
spring.http.encoding.enabled=true
spring.http.encoding.charset=UTF-8
spring.http.encoding.force=true
server.servlet.jsp.init-parameters.jspCompilerSourceVM=11
server.servlet.jsp.init-parameters.jspCompilerTargetVM=11

# JSP Configuration
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp
server.servlet.jsp.init-parameters.development=true

# Database Configuration - H2 (default for local development)
spring.datasource.url=jdbc:h2:mem:sistema_adopciones;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration with UTF-8 Support
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.connection.CharSet=UTF-8
spring.jpa.properties.hibernate.connection.characterEncoding=UTF-8
spring.jpa.properties.hibernate.connection.useUnicode=true

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Document Upload — T.2.3
app.upload.document.path=/var/uploads/documentos
app.upload.document.max-size=5242880


# Refugio Configuration — T.3.2
app.refugio.nombre=Paws & Home Sanctuary
app.refugio.representante=Administración Refugio
app.refugio.whatsapp=+34666777888
app.refugio.email=adopciones@pawshome.com
app.refugio.horario=Lunes-Viernes 09:00-18:00

# Logging
logging.level.root=INFO
logging.level.com.example.GR01_1BT3_622_26A=DEBUG


