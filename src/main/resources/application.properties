spring.application.name=SistemaDeAdopciones
server.port=8080

# Disable Docker Compose
spring.docker.compose.enabled=false
server.servlet.context-path=/
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10
server.tomcat.accept-count=100
server.tomcat.max-connections=10000
server.tomcat.connection-timeout=20000
server.servlet.session.timeout=30m
server.tomcat.uri-encoding=UTF-8
server.compression.enabled=true
server.compression.min-response-size=1024

# JSP Configuration
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp
server.servlet.jsp.init-parameters.development=true

# Database Configuration - H2 (default for local development)
spring.datasource.url=jdbc:h2:mem:sistema_adopciones;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging
logging.level.root=INFO
logging.level.com.example.GR01_1BT3_622_26A=DEBUG


